    conference: IEEE Transactions on Visualization and Computer Graphics <strong>(TVCG)</strong>, 2026.
    pdf: https://arxiv.org/abs/2507.13404
    image: /images/pubs/AortaDiff.webp
    summary: Volume-guided conditional diffusion for robust centerline extraction and smooth, multi-branch aortic surface reconstruction.

  - title: "AI-powered automated model construction for patient-specific CFD simulations of aortic flows"
    authors: Pan Du*, <strong>Delin An*</strong>, Chaoli Wang, Jian-Xun Wang
    conference_short: Sci. Adv.
